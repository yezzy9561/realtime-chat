<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>실시간 채팅</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg: #f2f4f6; --card: #fff; --sub: #f9fafb; --line: #e5e8eb;
    --ink: #191f28; --ink2: #4e5968; --ink3: #8b95a1;
    --blue: #3182f6; --blue-tint: #e8f3ff; --bubble: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101113; --card: #1b1d21; --sub: #23262b; --line: #2e3137;
      --ink: #f2f4f6; --ink2: #b0b8c1; --ink3: #6b7684;
      --blue: #4c95ff; --blue-tint: #1c2b42; --bubble: #262a30;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Pretendard, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 720px; height: 100dvh; display: flex; flex-direction: column; background: var(--card); }
  @media (min-width: 760px) { .app { height: calc(100dvh - 48px); margin: 24px 0; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.06); } }

  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .room { font-weight: 700; font-size: 17px; }
  .who { font-size: 13px; color: var(--ink3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-main { flex: 1; min-width: 0; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #1fc16b; margin-right: 5px; vertical-align: 1px; }
  .dot.off { background: #f04452; }
  button { font: inherit; cursor: pointer; border: 0; }
  .ghost { background: var(--sub); color: var(--ink2); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .ghost:hover { background: var(--line); }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
  .sys { align-self: center; font-size: 12px; color: var(--ink3); background: var(--sub); padding: 4px 10px; border-radius: 999px; margin: 6px 0; }
  .msg { display: flex; flex-direction: column; max-width: 78%; align-self: flex-start; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .name { font-size: 12px; color: var(--ink3); margin: 6px 0 3px 4px; }
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .msg.me .row { flex-direction: row-reverse; }
  .bubble { background: var(--bubble); padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg.me .bubble { background: var(--blue); color: #fff; }
  .time { font-size: 11px; color: var(--ink3); flex-shrink: 0; }

  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card); }
  textarea { flex: 1; resize: none; font: inherit; font-size: 15px; color: var(--ink); background: var(--sub); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; max-height: 120px; outline: none; }
  textarea:focus { border-color: var(--blue); }
  .primary { background: var(--blue); color: #fff; font-weight: 700; padding: 0 18px; border-radius: 12px; font-size: 15px; }
  .primary:disabled { opacity: .4; cursor: default; }

  /* 입장 화면 */
  .join { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; gap: 14px; }
  .join h1 { font-size: 24px; margin: 0; }
  .join p { color: var(--ink2); margin: 0 0 8px; }
  .join input { font: inherit; font-size: 16px; color: var(--ink); background: var(--sub); border: 1px solid var(--line); border-radius: 12px; padding: 14px; outline: none; }
  .join input:focus { border-color: var(--blue); }
  .join .primary { padding: 14px; }
  .hidden { display: none !important; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #191f28; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <!-- 입장 -->
  <section class="join" id="joinView">
    <h1>채팅방 <span id="joinRoom"></span></h1>
    <p>대화에서 쓸 이름을 입력해 주세요.</p>
    <input id="nameInput" maxlength="20" placeholder="예: 김토스" autocomplete="off" />
    <button class="primary" id="joinBtn">입장하기</button>
  </section>

  <!-- 채팅 -->
  <header class="hidden" id="chatHead">
    <div class="head-main">
      <div class="room" id="roomTitle"></div>
      <div class="who"><span class="dot off" id="dot"></span><span id="who">연결 중…</span></div>
    </div>
    <button class="ghost" id="shareBtn">링크 복사</button>
  </header>
  <div id="log" class="hidden"></div>
  <form id="form" class="hidden">
    <textarea id="text" rows="1" maxlength="1000" placeholder="메시지 입력 (Shift+Enter 줄바꿈)"></textarea>
    <button class="primary" id="sendBtn" disabled>전송</button>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const room = (params.get("room") || "lobby").slice(0, 40);
  let me = { clientId: null, publicId: null, name: "", seq: 0 };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  $("joinRoom").textContent = "· " + room;
  $("roomTitle").textContent = room;
  $("nameInput").value = store.get("chat-name") || "";
  $("nameInput").focus();

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 1600);
  }

  function fmtTime(at) {
    return new Date(at).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
  }

  let lastSender = null;
  function render(msg) {
    const log = $("log");
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    if (msg.type === "system") {
      const el = document.createElement("div");
      el.className = "sys";
      el.textContent = msg.text;
      log.appendChild(el);
      lastSender = null;
    } else {
      const mine = msg.from === me.publicId;
      const wrap = document.createElement("div");
      wrap.className = "msg" + (mine ? " me" : "");
      if (!mine && lastSender !== msg.from) {
        const n = document.createElement("div");
        n.className = "name";
        n.textContent = msg.name;
        wrap.appendChild(n);
      }
      const row = document.createElement("div");
      row.className = "row";
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = msg.text; // textContent로 넣어 HTML 삽입 차단
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = fmtTime(msg.at);
      row.append(b, t);
      wrap.appendChild(row);
      log.appendChild(wrap);
      lastSender = msg.from;
    }
    if (nearBottom || msg.from === me.publicId) log.scrollTop = log.scrollHeight;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function showPresence(names) {
    $("dot").classList.remove("off");
    $("who").textContent = `${names.length}명 접속 · ${names.join(", ")}`;
  }

  function showOffline() {
    $("dot").classList.add("off");
    $("who").textContent = "연결이 끊겼어요. 다시 연결하는 중…";
  }

  async function joinRoom() {
    const r = await fetch("/join", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room, name: me.name }),
    });
    if (!r.ok) throw new Error("join failed");
    const d = await r.json();
    me.clientId = d.clientId;
    me.publicId = d.publicId;
    me.seq = d.seq;
    $("log").innerHTML = "";
    lastSender = null;
    d.history.forEach(render);
    showPresence(d.presence);
    $("log").scrollTop = $("log").scrollHeight;
  }

  // 롱폴링: 서버가 새 메시지가 생길 때까지 응답을 붙잡아 두므로 거의 즉시 도착함
  async function connect() {
    for (;;) {
      try {
        if (!me.clientId) await joinRoom();
        const r = await fetch(
          `/poll?room=${encodeURIComponent(room)}&clientId=${me.clientId}&since=${me.seq}`,
          { cache: "no-store" }
        );
        if (r.status === 403) { me.clientId = null; continue; } // 서버 재시작·시간초과 → 재입장
        if (!r.ok) throw new Error("poll " + r.status);
        const d = await r.json();
        d.events.forEach(render);
        me.seq = d.seq;
        showPresence(d.presence);
      } catch {
        showOffline();
        await sleep(2000);
      }
    }
  }

  addEventListener("pagehide", () => {
    if (me.clientId) navigator.sendBeacon("/leave", JSON.stringify({ room, clientId: me.clientId }));
  });

  function join() {
    const name = $("nameInput").value.replace(/\s+/g, " ").trim();
    if (!name) return $("nameInput").focus();
    me.name = name;
    store.set("chat-name", name);
    $("joinView").classList.add("hidden");
    ["chatHead", "log", "form"].forEach((id) => $(id).classList.remove("hidden"));
    $("text").focus();
    connect();
  }

  $("joinBtn").onclick = join;
  $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) join(); });

  const ta = $("text");
  function autosize() {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    $("sendBtn").disabled = !ta.value.trim();
  }
  ta.addEventListener("input", autosize);
  ta.addEventListener("keydown", (e) => {
    // isComposing: 한글 조합 중 Enter로 인한 중복 전송 방지
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $("form").requestSubmit();
    }
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = ta.value.trim();
    if (!text || !me.clientId) return;
    ta.value = "";
    autosize();
    const r = await fetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room, clientId: me.clientId, text }),
    }).catch(() => null);
    if (!r || !r.ok) {
      ta.value = text;
      autosize();
      toast(r && r.status === 429 ? "너무 빨리 보내고 있어요. 잠시 후 다시 보내 주세요." : "전송하지 못했어요.");
    }
  });

  $("shareBtn").onclick = async () => {
    const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(room)}`;
    try {
      await navigator.clipboard.writeText(link);
      toast("채팅방 링크를 복사했어요");
    } catch {
      prompt("이 링크를 복사해서 공유하세요", link);
    }
  };
</script>
</body>
</html>
